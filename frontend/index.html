<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova de control de coneixements - DGT</title>
    <link rel="icon" type="image/png" href="./img/coche.png">
    <link rel="stylesheet" href="tailwind.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex w-full max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
            <span class="font-semibold tracking-tight text-indigo-900">Prueba de control de conocimientos · B</span>
            <span id="userNameText" class="text-sm text-slate-500">Aspirant: </span>
        </div>
    </header>

    <main class="mx-auto flex w-full max-w-7xl flex-1 flex-col px-4 py-8 sm:px-6 lg:px-8">
        <form id="user-form" class="m-auto w-full max-w-md rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <h2 class="mb-6 border-b border-slate-100 pb-4 text-xl font-semibold tracking-tight text-slate-900">Accés a l'Aula Virtual</h2>
            <div class="mb-5">
                <label for="name" class="mb-2 block text-sm font-medium text-slate-700">Nom:</label>
                <input type="text" id="name" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
            </div>
            <div class="mb-5">
                <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email:</label>
                <input type="email" id="email" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
            </div>
            <button type="submit" class="w-full rounded-xl bg-indigo-700 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-indigo-800 focus:outline-none focus:ring-4 focus:ring-indigo-200">Començar Test</button>
            <button type="button" id="boto-obrir-admin" class="mx-auto mt-4 block rounded-lg px-3 py-2 text-sm font-medium text-slate-500 transition hover:bg-slate-50 hover:text-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-100">Panell d'administració</button>
        </form>

        <section id="admin-container" class="hidden w-full rounded-3xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
            <div class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Panell d'administració</h1>
                    <p class="mt-1 text-sm text-slate-500">Gestiona les preguntes de la base de dades.</p>
                </div>
                <button type="button" id="boto-tornar-inici" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100">Tornar a l'inici</button>
            </div>

            <form id="admin-question-form" class="rounded-2xl border border-slate-200 bg-slate-50/70 p-5 sm:p-6">
                <h2 id="admin-form-title" class="mb-5 text-lg font-semibold text-slate-900">Crear pregunta</h2>
                <input type="hidden" id="admin-question-id">
                <div class="mb-5">
                    <label for="admin-question-text" class="mb-2 block text-sm font-medium text-slate-700">Pregunta:</label>
                    <textarea id="admin-question-text" rows="3" required class="w-full resize-y rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"></textarea>
                </div>
                <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
                    <div>
                        <label for="admin-answers" class="mb-2 block text-sm font-medium text-slate-700">Respostes (una per línia):</label>
                        <textarea id="admin-answers" rows="4" required class="w-full resize-y rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"></textarea>
                    </div>
                    <div>
                        <label for="admin-correct-answer" class="mb-2 block text-sm font-medium text-slate-700">Resposta correcta:</label>
                        <select id="admin-correct-answer" required disabled class="mb-5 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 disabled:cursor-not-allowed disabled:bg-slate-100">
                            <option value="">Afegeix primer les respostes</option>
                        </select>
                        <label for="admin-image" class="mb-2 block text-sm font-medium text-slate-700">Imatge (opcional, JPG, PNG, GIF o WebP):</label>
                        <input type="file" id="admin-image" accept="image/jpeg,image/png,image/gif,image/webp" class="block w-full cursor-pointer rounded-xl border border-slate-300 bg-white text-sm text-slate-600 file:mr-4 file:cursor-pointer file:border-0 file:bg-indigo-50 file:px-4 file:py-3 file:font-semibold file:text-indigo-700 hover:file:bg-indigo-100">
                        <input type="hidden" id="admin-image-path">
                        <p id="admin-current-image" class="hidden mt-2 break-all text-sm text-slate-500"></p>
                    </div>
                </div>
                <div class="mt-6 flex flex-wrap items-center gap-3">
                    <button type="submit" id="admin-save-button" class="rounded-xl bg-emerald-700 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-100">Crear pregunta</button>
                    <button type="button" id="admin-cancel-edit" class="hidden rounded-xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100">Cancel·lar edició</button>
                </div>
            </form>

            <p id="admin-message" class="mt-3 min-h-6 text-sm text-emerald-700" role="status" aria-live="polite"></p>
            <section class="mt-8" aria-labelledby="admin-questions-title">
                <h2 id="admin-questions-title" class="text-xl font-semibold tracking-tight text-slate-900">Preguntes existents</h2>
                <div id="admin-questions-list" class="mt-4 flex flex-col gap-3"></div>
            </section>
        </section>

        <section id="quiz-container" class="hidden flex-1 flex-col rounded-3xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
            <div class="grid flex-1 grid-cols-1 items-start gap-6 border-b border-slate-100 pb-6 lg:grid-cols-[minmax(0,420px)_1fr] lg:gap-8">
                <div id="imatge-container" class="hidden min-h-64 items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 p-4"></div>
                <div id="partida" class="min-w-0"></div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 py-4">
                <p id="temporitzador" class="font-mono font-semibold tabular-nums text-indigo-800" role="timer" aria-live="off">Temps: 00:00</p>
                <button id="boto-enviar" class="hidden rounded-xl bg-emerald-700 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-100">Finalitzar Test</button>
                <button id="boto-esborrar" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100">Esborrar nom</button>
            </div>

            <div class="pt-4">
                <div id="marcador" class="grid grid-cols-5 gap-2 sm:grid-cols-10"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
