<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoescola Diaz</title>
    <link rel="icon" type="./img/coche.png" href="./img/coche.png">
</head>
<body>
    <form id="user-form">
        <label for="name">Nom:</label>
        <input type="text" id="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required><br><br>

        <button type="submit">Començar</button>
    </form>

    <section id="quiz-container" class="hidden">
        <p id="userNameText"></p>
        <div id="marcador"></div>
        <div id="partida"></div>
        <button id="boto-enviar" class="hidden">Enviar Resultats</button>
        <button id="boto-esborrar">Esborrar nom</button>
    </section>

    <script src="script.js"></script>
</body>
<style>
  .hidden {
    display: none !important;
  }
</style>
</html>
