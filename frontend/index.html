<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova de control de coneixements - DGT</title>
    <link rel="icon" type="image/png" href="./img/coche.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dgt-header">
        <div class="dgt-header-content">
            <span class="dgt-title">Prueba de control de conocimientos · B</span>
            <span id="userNameText" class="dgt-user">Aspirant: </span>
        </div>
    </header>

    <main class="main-container-fluid">
        <form id="user-form" class="exam-card-center">
            <h2>Accés a l'Aula Virtual</h2>
            <div class="form-group">
                <label for="name">Nom:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit" class="btn-primary">Començar Test</button>
            <button type="button" id="boto-obrir-admin" class="admin-access-link">Panell d'administració</button>
        </form>

        <section id="admin-container" class="admin-panel hidden">
            <div class="admin-header">
                <div>
                    <h1>Panell d'administració</h1>
                    <p>Gestiona les preguntes de la base de dades.</p>
                </div>
                <button type="button" id="boto-tornar-inici" class="btn-secondary">Tornar a l'inici</button>
            </div>

            <form id="admin-question-form" class="admin-form">
                <h2 id="admin-form-title">Crear pregunta</h2>
                <input type="hidden" id="admin-question-id">
                <div class="form-group">
                    <label for="admin-question-text">Pregunta:</label>
                    <textarea id="admin-question-text" rows="3" required></textarea>
                </div>
                <div class="admin-form-grid">
                    <div class="form-group">
                        <label for="admin-answers">Respostes (una per línia):</label>
                        <textarea id="admin-answers" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="admin-correct-answer">Resposta correcta:</label>
                        <select id="admin-correct-answer" required disabled>
                            <option value="">Afegeix primer les respostes</option>
                        </select>
                        <label for="admin-image">Imatge (opcional, JPG, PNG, GIF o WebP):</label>
                        <input type="file" id="admin-image" accept="image/jpeg,image/png,image/gif,image/webp">
                        <input type="hidden" id="admin-image-path">
                        <p id="admin-current-image" class="admin-image-path hidden"></p>
                    </div>
                </div>
                <div class="admin-form-actions">
                    <button type="submit" id="admin-save-button" class="btn-success">Crear pregunta</button>
                    <button type="button" id="admin-cancel-edit" class="btn-secondary hidden">Cancel·lar edició</button>
                </div>
            </form>

            <p id="admin-message" class="admin-message" role="status" aria-live="polite"></p>
            <section class="admin-questions-section" aria-labelledby="admin-questions-title">
                <h2 id="admin-questions-title">Preguntes existents</h2>
                <div id="admin-questions-list" class="admin-questions-list"></div>
            </section>
        </section>

        <section id="quiz-container" class="exam-panel-fluid hidden">
            
            <div class="exam-content-grid">
                <div id="imatge-container" class="exam-image-box"></div>
                <div id="partida" class="exam-question-box"></div>
            </div>

            <div class="exam-nav-bar">
                <p id="temporitzador" class="timer" role="timer" aria-live="off">Temps: 00:00</p>
                <button id="boto-enviar" class="btn-success hidden">Finalitzar Test</button>
                <button id="boto-esborrar" class="btn-secondary">Esborrar nom</button>
            </div>

            <div class="marcador-footer">
                <div id="marcador" class="dgt-grid"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
